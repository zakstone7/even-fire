<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Discourage the WebView from caching this shell so it re-fetches and
         picks up the newest hashed bundle after a deploy. The bundle filename
         itself is content-hashed, so the JS can never be served stale. -->
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Fire</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0d0f10;
        --fg: #e8ffe8;
        --muted: #8a9a8a;
        --line: #26302a;
        --accent: #7CFC7C;
        --danger: #ff6b6b;
        --field: #151a17;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #app { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }
      /* Fallback text shown before the bundle boots or outside the WebView. */
      #boot { color: var(--muted); padding: 24px 16px; }
      noscript { color: var(--danger); display: block; padding: 24px 16px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">Loading Fire…</div>
    </div>
    <noscript>Fire needs JavaScript, which is disabled.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
